<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#a78bfa;#f472b6;#a78bfa;#60a5fa" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f472b6;#60a5fa;#f472b6;#a78bfa" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#60a5fa;#a78bfa;#60a5fa;#f472b6" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <style>
      .logo {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 40px;
        letter-spacing: -2.5px;
        fill: url(#shimmer);
      }
    </style>
  </defs>
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" class="logo">HRSH</text>
</svg>